name: Update Starship calendar

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["build_ics.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ICS
        env:
          LL2_API_KEY: ${{ secrets.LL2_API_KEY }}  # optional
        run: python build_ics.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain docs/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/starship.ics
            git commit -m "Update Starship calendar"
            git push
          else
            echo "Calendar unchanged"
          fi
